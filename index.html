<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Offline QR Exam</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body{
      font-family: Arial;
      margin:0;
      padding:0;
      background:#f3f4f6;
    }

    .screen{
      display:none;
      padding:20px;
    }

    .active{
      display:block;
    }

    h1,h2{
      text-align:center;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-size:18px;
      background:#2563eb;
      color:white;
    }

    .option{
      background:white;
      padding:15px;
      margin-top:10px;
      border-radius:10px;
      border:2px solid #ddd;
      cursor:pointer;
    }

    .selected{
      border:2px solid #2563eb;
      background:#dbeafe;
    }

    #reader{
      width:100%;
    }

    #qrcode{
      text-align:center;
      margin-top:20px;
    }

    #timer{
      font-size:22px;
      text-align:center;
      margin-bottom:20px;
      color:red;
    }
  </style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen" class="screen active">

  <h1>Offline Exam</h1>

  <button onclick="startScanner()">
    Scan Exam QR
  </button>

</div>

<!-- QR SCAN -->
<div id="scanScreen" class="screen">

  <h2>Scan Question QR</h2>

  <div id="reader"></div>

</div>

<!-- EXAM -->
<div id="examScreen" class="screen">

  <div id="timer"></div>

  <h2 id="questionText"></h2>

  <div id="optionsContainer"></div>

  <button onclick="nextQuestion()">
    Next
  </button>

</div>

<!-- RESULT -->
<div id="resultScreen" class="screen">

  <h1>Exam Completed</h1>

  <h2 id="scoreText"></h2>

  <div id="qrcode"></div>

</div>

<script>

let paper = null;
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let studentAnswers = [];

let timeLeft = 600;
let timerInterval;

function showScreen(id){

  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
}

function startScanner(){

  showScreen("scanScreen");

  const scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps:10,
      qrbox:250
    },
    (decodedText)=>{

      scanner.stop();

      loadPaper(decodedText);

    }
  );
}

function loadPaper(jsonText){

  paper = JSON.parse(jsonText);

  currentQuestion = 0;
  score = 0;
  studentAnswers = [];

  startTimer();

  showScreen("examScreen");

  renderQuestion();
}

function renderQuestion(){

  selectedAnswer = null;

  const q = paper.questions[currentQuestion];

  document.getElementById("questionText").innerText =
    (currentQuestion + 1) + ". " + q.q;

  const container =
    document.getElementById("optionsContainer");

  container.innerHTML = "";

  q.options.forEach((opt,index)=>{

    const div = document.createElement("div");

    div.className = "option";

    div.innerText = opt;

    div.onclick = ()=>{

      document.querySelectorAll('.option')
        .forEach(o=>o.classList.remove('selected'));

      div.classList.add('selected');

      selectedAnswer = index;

    };

    container.appendChild(div);

  });
}

function nextQuestion(){

  if(selectedAnswer === null){

    alert("Select an answer");

    return;
  }

  const q = paper.questions[currentQuestion];

  studentAnswers.push(selectedAnswer);

  if(selectedAnswer === q.answer){

    score++;

  }

  currentQuestion++;

  if(currentQuestion >= paper.questions.length){

    finishExam();

  }else{

    renderQuestion();

  }
}

function startTimer(){

  updateTimer();

  timerInterval = setInterval(()=>{

    timeLeft--;

    updateTimer();

    if(timeLeft <= 0){

      finishExam();

    }

  },1000);
}

function updateTimer(){

  const mins =
    Math.floor(timeLeft / 60);

  const secs =
    timeLeft % 60;

  document.getElementById("timer").innerText =
    mins + ":" + String(secs).padStart(2,'0');
}

function finishExam(){

  clearInterval(timerInterval);

  showScreen("resultScreen");

  document.getElementById("scoreText").innerText =
    "Score: " + score + " / " + paper.questions.length;

  generateResultQR();
}

function generateResultQR(){

  const result = {

    student:"STUDENT01",

    score:score,

    total:paper.questions.length,

    answers:studentAnswers

  };

  const resultText = JSON.stringify(result);

  document.getElementById("qrcode").innerHTML = "";

  QRCode.toCanvas(resultText, { width:250 }, function (err, canvas) {

    document.getElementById("qrcode")
      .appendChild(canvas);

  });
}

</script>

</body>
</html>
