<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offline QR Exam</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

body{
    font-family:Arial;
    margin:0;
    background:#f2f2f2;
}

.screen{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

h1,h2{
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
}

#reader{
    width:100%;
}

.option{
    background:white;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    border:2px solid #ddd;
    cursor:pointer;
}

.selected{
    border:2px solid #2563eb;
    background:#dbeafe;
}

#timer{
    text-align:center;
    font-size:24px;
    color:red;
    margin-bottom:20px;
}

#qrcode{
    margin-top:20px;
    text-align:center;
}

.small{
    text-align:center;
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<!-- HOME -->

<div id="homeScreen" class="screen active">

    <h1>Offline Exam</h1>

    <button onclick="startScanner()">
        Scan Exam QR
    </button>

    <div class="small">
        Scan teacher QR to load exam
    </div>

</div>

<!-- SCAN -->

<div id="scanScreen" class="screen">

    <h2>Scan Exam QR</h2>

    <div id="reader"></div>

</div>

<!-- EXAM -->

<div id="examScreen" class="screen">

    <div id="timer"></div>

    <h2 id="questionText"></h2>

    <div id="optionsContainer"></div>

    <button onclick="nextQuestion()">
        Next Question
    </button>

</div>

<!-- RESULT -->

<div id="resultScreen" class="screen">

    <h1>Exam Completed</h1>

    <h2 id="scoreText"></h2>

    <div id="qrcode"></div>

    <div class="small">
        Teacher scans this QR
    </div>

</div>

<script>

let paper = null;

let currentQuestion = 0;

let selectedAnswer = null;

let score = 0;

let studentAnswers = [];

let timeLeft = 300;

let timerInterval = null;

function showScreen(id){

    document.querySelectorAll('.screen').forEach(s=>{

        s.classList.remove('active');

    });

    document.getElementById(id).classList.add('active');
}

function startScanner(){

    showScreen("scanScreen");

    const scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        {
            fps:10,
            qrbox:250
        },

        (decodedText)=>{

            scanner.stop();

            loadPaper(decodedText);

        }
    );
}

function loadPaper(text){

    try{

        const parts = text.split("~");

        const title = parts[0];

        const rawQuestions = parts[1].split(";");

        paper = {

            title:title,

            questions:[]
        };

        rawQuestions.forEach(q=>{

            if(q.trim() === "") return;

            const fields = q.split("|");

            paper.questions.push({

                q: fields[0],

                options:[
                    fields[1],
                    fields[2],
                    fields[3],
                    fields[4]
                ],

                answer: parseInt(fields[5])

            });

        });

        currentQuestion = 0;

        score = 0;

        studentAnswers = [];

        startTimer();

        showScreen("examScreen");

        renderQuestion();

    }catch(err){

        alert("Invalid QR format");

        console.log(err);

        showScreen("homeScreen");
    }
}

function renderQuestion(){

    selectedAnswer = null;

    const q = paper.questions[currentQuestion];

    document.getElementById("questionText").innerText =
        (currentQuestion + 1) + ". " + q.q;

    const container =
        document.getElementById("optionsContainer");

    container.innerHTML = "";

    q.options.forEach((opt,index)=>{

        const div = document.createElement("div");

        div.className = "option";

        div.innerText = opt;

        div.onclick = ()=>{

            document.querySelectorAll('.option').forEach(o=>{

                o.classList.remove('selected');

            });

            div.classList.add('selected');

            selectedAnswer = index;
        };

        container.appendChild(div);

    });
}

function nextQuestion(){

    if(selectedAnswer === null){

        alert("Select an answer");

        return;
    }

    const q = paper.questions[currentQuestion];

    studentAnswers.push(selectedAnswer);

    if(selectedAnswer === q.answer){

        score++;
    }

    currentQuestion++;

    if(currentQuestion >= paper.questions.length){

        finishExam();

    }else{

        renderQuestion();
    }
}

function startTimer(){

    updateTimer();

    timerInterval = setInterval(()=>{

        timeLeft--;

        updateTimer();

        if(timeLeft <= 0){

            finishExam();
        }

    },1000);
}

function updateTimer(){

    const mins = Math.floor(timeLeft / 60);

    const secs = timeLeft % 60;

    document.getElementById("timer").innerText =
        mins + ":" + String(secs).padStart(2,'0');
}

function finishExam(){

    clearInterval(timerInterval);

    showScreen("resultScreen");

    document.getElementById("scoreText").innerText =
        "Score: " + score + " / " + paper.questions.length;

    generateResultQR();
}

function generateResultQR(){

    const resultText =
        "STUDENT01|" +
        score + "|" +
        studentAnswers.join(",");

    document.getElementById("qrcode").innerHTML = "";

    QRCode.toCanvas(resultText,

    {
        width:250
    },

    function(err,canvas){

        document.getElementById("qrcode")
            .appendChild(canvas);

    });
}

</script>

</body>
</html>
