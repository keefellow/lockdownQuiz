<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offline Science Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.screen{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

h1,h2{
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
}

.option{
    background:white;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    border:2px solid #ddd;
    cursor:pointer;
}

.selected{
    border:2px solid #2563eb;
    background:#dbeafe;
}

#timer{
    text-align:center;
    color:red;
    font-size:24px;
    margin-bottom:20px;
}

#qrcode{
    text-align:center;
    margin-top:20px;
}

.small{
    text-align:center;
    color:#666;
    font-size:14px;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
    font-size:16px;
    border-radius:10px;
}

</style>

</head>

<body>

<!-- HOME -->

<div id="homeScreen" class="screen active">

    <h1>Offline Science Quiz</h1>

    <textarea id="unlockInput"
placeholder="Paste unlock code here"></textarea>

    <button onclick="unlockExam()">
        Unlock Exam
    </button>

    <div class="small">
        Paste teacher unlock code
    </div>

</div>

<!-- EXAM -->

<div id="examScreen" class="screen">

    <div id="timer"></div>

    <h2 id="questionText"></h2>

    <div id="optionsContainer"></div>

    <button onclick="nextQuestion()">
        Next Question
    </button>

</div>

<!-- RESULT -->

<div id="resultScreen" class="screen">

    <h1>Exam Completed</h1>

    <h2 id="scoreText"></h2>

    <div id="qrcode"></div>

    <div class="small">
        Teacher scans this QR
    </div>

</div>

<script>

//////////////////////////////////////////////////////////
// EXAM DATA
//////////////////////////////////////////////////////////

const examText = `Science Quiz~
What gas do plants absorb during photosynthesis?|Oxygen|Nitrogen|Carbon Dioxide|Hydrogen|2;
Which organ pumps blood throughout the human body?|Lungs|Brain|Heart|Liver|2;
What is the boiling point of water at sea level?|90C|95C|100C|120C|2;
Which planet is known as the Red Planet?|Earth|Venus|Mars|Jupiter|2;
What force keeps objects attracted to Earth?|Magnetism|Gravity|Electricity|Friction|1;
Which part of the plant conducts photosynthesis?|Root|Stem|Leaf|Flower|2;
What is the largest mammal on Earth?|Elephant|Blue Whale|Giraffe|Shark|1;
Which gas do humans need to breathe to survive?|Nitrogen|Oxygen|Carbon Dioxide|Helium|1;
What is the center of an atom called?|Electron|Nucleus|Proton|Shell|1;
Which planet is closest to the Sun?|Earth|Mercury|Mars|Saturn|1;
What is the process of water changing into vapor called?|Melting|Condensation|Evaporation|Freezing|2;
Which blood vessels carry blood away from the heart?|Veins|Capillaries|Arteries|Nerves|2;
Which scientist proposed the theory of gravity after observing a falling apple?|Newton|Einstein|Tesla|Darwin|0;
What is the main source of energy for Earth?|Moon|Sun|Wind|Volcanoes|1;
Which material is attracted to magnets?|Plastic|Wood|Iron|Glass|2;
What is the chemical symbol for water?|WO|H2O|O2|HO|1;
Which organ helps humans breathe?|Heart|Lungs|Kidney|Skin|1;
What is the nearest star to Earth?|Mars|Moon|Sun|Venus|2;
Which state of matter has a fixed shape and volume?|Gas|Liquid|Solid|Plasma|2;
What do bees collect from flowers?|Pollen|Sand|Water|Stone|0;
Which planet has visible rings around it?|Earth|Mars|Saturn|Mercury|2;
What is the freezing point of water?|0C|10C|50C|100C|0;
Which part of the body contains the brain?|Chest|Arm|Head|Leg|2;
What gas is released during photosynthesis?|Hydrogen|Carbon Dioxide|Oxygen|Nitrogen|2;
Which force slows moving objects?|Gravity|Friction|Magnetism|Light|1;
What is the hardest natural substance?|Gold|Iron|Diamond|Silver|2;
Which organ filters waste from blood?|Heart|Liver|Kidney|Lungs|2;
What type of energy comes from moving air?|Solar|Wind|Chemical|Nuclear|1;
What is the outer layer of Earth called?|Mantle|Core|Crust|Shell|2;
Which planet is the largest in the solar system?|Earth|Saturn|Jupiter|Mars|2;
What do humans exhale after breathing?|Oxygen|Nitrogen|Carbon Dioxide|Helium|2;
Which simple machine includes a wheel and axle?|Lever|Pulley|Wheelbarrow|Ramp|2;
What part of the cell contains genetic material?|Membrane|Nucleus|Cytoplasm|Wall|1;
Which vitamin is mainly obtained from sunlight?|Vitamin A|Vitamin B|Vitamin C|Vitamin D|3;
What is the natural satellite of Earth?|Mars|Moon|Sun|Venus|1;
Which process turns liquid water into ice?|Evaporation|Freezing|Melting|Boiling|1;
What do we call animals that eat only plants?|Carnivores|Omnivores|Herbivores|Predators|2;
Which instrument is used to measure temperature?|Thermometer|Barometer|Compass|Scale|0;
What protects Earth from harmful ultraviolet rays?|Clouds|Ozone Layer|Mountains|Rain|1;
Which part of the digestive system absorbs most nutrients?|Stomach|Small Intestine|Liver|Esophagus|1`;

//////////////////////////////////////////////////////////
// VARIABLES
//////////////////////////////////////////////////////////

let paper = null;

let currentQuestion = 0;

let selectedAnswer = null;

let score = 0;

let studentAnswers = [];

let timeLeft = 1800;

let timerInterval = null;

//////////////////////////////////////////////////////////
// SCREEN CONTROL
//////////////////////////////////////////////////////////

function showScreen(id){

    document.querySelectorAll('.screen').forEach(s=>{

        s.classList.remove('active');

    });

    document.getElementById(id).classList.add('active');
}

//////////////////////////////////////////////////////////
// UNLOCK
//////////////////////////////////////////////////////////

function unlockExam(){

    const code =
        document.getElementById("unlockInput")
        .value
        .trim();

    if(code !== "SCIENCE2026"){

        alert("Wrong unlock code");

        return;
    }

    parseExam(examText);
}

//////////////////////////////////////////////////////////
// PARSE EXAM
//////////////////////////////////////////////////////////

function parseExam(text){

    const parts = text.split("~");

    const title = parts[0];

    const rawQuestions = parts[1].split(";");

    paper = {

        title:title,

        questions:[]
    };

    rawQuestions.forEach(q=>{

        if(q.trim() === "") return;

        const fields = q.split("|");

        paper.questions.push({

            q: fields[0],

            options:[
                fields[1],
                fields[2],
                fields[3],
                fields[4]
            ],

            answer: parseInt(fields[5])

        });

    });

    currentQuestion = 0;

    score = 0;

    studentAnswers = [];

    startTimer();

    showScreen("examScreen");

    renderQuestion();
}

//////////////////////////////////////////////////////////
// RENDER QUESTION
//////////////////////////////////////////////////////////

function renderQuestion(){

    selectedAnswer = null;

    const q = paper.questions[currentQuestion];

    document.getElementById("questionText").innerText =
        (currentQuestion + 1) + ". " + q.q;

    const container =
        document.getElementById("optionsContainer");

    container.innerHTML = "";

    q.options.forEach((opt,index)=>{

        const div = document.createElement("div");

        div.className = "option";

        div.innerText = opt;

        div.onclick = ()=>{

            document.querySelectorAll('.option').forEach(o=>{

                o.classList.remove('selected');

            });

            div.classList.add('selected');

            selectedAnswer = index;
        };

        container.appendChild(div);

    });
}

//////////////////////////////////////////////////////////
// NEXT QUESTION
//////////////////////////////////////////////////////////

function nextQuestion(){

    if(selectedAnswer === null){

        alert("Select an answer");

        return;
    }

    const q = paper.questions[currentQuestion];

    studentAnswers.push(selectedAnswer);

    if(selectedAnswer === q.answer){

        score++;
    }

    currentQuestion++;

    if(currentQuestion >= paper.questions.length){

        finishExam();

    }else{

        renderQuestion();
    }
}

//////////////////////////////////////////////////////////
// TIMER
//////////////////////////////////////////////////////////

function startTimer(){

    updateTimer();

    timerInterval = setInterval(()=>{

        timeLeft--;

        updateTimer();

        if(timeLeft <= 0){

            finishExam();
        }

    },1000);
}

function updateTimer(){

    const mins = Math.floor(timeLeft / 60);

    const secs = timeLeft % 60;

    document.getElementById("timer").innerText =
        mins + ":" + String(secs).padStart(2,'0');
}

//////////////////////////////////////////////////////////
// FINISH
//////////////////////////////////////////////////////////

function finishExam(){

    clearInterval(timerInterval);

    showScreen("resultScreen");

    document.getElementById("scoreText").innerText =
        "Score: " + score + " / " + paper.questions.length;

    generateResultQR();
}

//////////////////////////////////////////////////////////
// RESULT QR
//////////////////////////////////////////////////////////

function generateResultQR(){

    const resultText =
        "STUDENT01|" +
        score + "|" +
        studentAnswers.join(",");

    document.getElementById("qrcode").innerHTML = "";

    QRCode.toCanvas(resultText,

    {
        width:250
    },

    function(err,canvas){

        document.getElementById("qrcode")
            .appendChild(canvas);

    });
}

</script>

</body>
</html>
